services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jfit
      POSTGRES_USER: jfit
      POSTGRES_PASSWORD: jfit
    ports: ["5432:5432"]
    volumes: ["jfit-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jfit -d jfit"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  jfit-postgres:
